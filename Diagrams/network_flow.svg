<svg width="800" viewBox="0 0 680 580" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Arial, Helvetica, sans-serif">
<title>Proxmox virtualised attack/defense lab — network topology</title>
<desc>Structured network diagram showing four virtual network segments connected through an OPNsense firewall on Proxmox VE, with firewall rules annotated on each inter-segment path.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- Background -->
<rect width="680" height="580" fill="white"/>

<!-- KALI -->
<rect x="240" y="30" width="200" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text font-size="14" font-weight="500" x="340" y="57" text-anchor="middle" fill="#712B13">Kali — External host</text>
<text font-size="12" x="340" y="75" text-anchor="middle" fill="#993C1D">192.168.1.67</text>

<!-- vmbr0 -->
<text font-size="11" x="340" y="100" text-anchor="middle" fill="#888780">vmbr0 · WAN · 192.168.1.0/24</text>
<line x1="340" y1="86" x2="340" y2="138" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>

<!-- OPNSENSE -->
<rect x="60" y="140" width="560" height="64" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text font-size="14" font-weight="500" x="340" y="163" text-anchor="middle" fill="#3C3489">OPNsense — Firewall / Router</text>
<text font-size="12" x="340" y="183" text-anchor="middle" fill="#534AB7">vtnet0 · vtnet1 · vtnet2 · vtnet3</text>

<!-- Arrow + rule: WAN → DMZ -->
<line x1="160" y1="204" x2="140" y2="268" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="58" y="220" width="96" height="34" rx="6" fill="none" stroke="#1D9E75" stroke-width="0.5"/>
<text font-size="11" x="106" y="235" text-anchor="middle" fill="#0F6E56">TCP 80, 443</text>
<text font-size="11" x="106" y="249" text-anchor="middle" fill="#0F6E56">pass ✓</text>

<!-- Arrow + rule: WAN → Internal (block) -->
<line x1="340" y1="204" x2="340" y2="268" stroke="#E24B4A" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
<rect x="290" y="220" width="100" height="34" rx="6" fill="none" stroke="#E24B4A" stroke-width="0.5"/>
<text font-size="11" x="340" y="235" text-anchor="middle" fill="#A32D2D">all ports</text>
<text font-size="11" x="340" y="249" text-anchor="middle" fill="#A32D2D">block ✗</text>

<!-- Arrow + rule: WAN → Monitoring -->
<line x1="520" y1="204" x2="540" y2="268" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="526" y="220" width="98" height="34" rx="6" fill="none" stroke="#1D9E75" stroke-width="0.5"/>
<text font-size="11" x="575" y="235" text-anchor="middle" fill="#0F6E56">log agents</text>
<text font-size="11" x="575" y="249" text-anchor="middle" fill="#0F6E56">pass ✓</text>

<!-- DMZ -->
<rect x="40" y="270" width="178" height="64" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text font-size="14" font-weight="500" x="129" y="292" text-anchor="middle" fill="#085041">DMZ segment</text>
<text font-size="12" x="129" y="308" text-anchor="middle" fill="#0F6E56">192.168.10.67</text>
<text font-size="11" x="129" y="324" text-anchor="middle" fill="#0F6E56">vmbr1 · 192.168.10.0/24</text>

<!-- Internal -->
<rect x="251" y="270" width="178" height="64" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text font-size="14" font-weight="500" x="340" y="292" text-anchor="middle" fill="#2C2C2A">Internal segment</text>
<text font-size="12" x="340" y="308" text-anchor="middle" fill="#5F5E5A">192.168.20.67</text>
<text font-size="11" x="340" y="324" text-anchor="middle" fill="#5F5E5A">vmbr2 · 192.168.20.0/24</text>

<!-- Monitoring -->
<rect x="462" y="270" width="178" height="64" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text font-size="14" font-weight="500" x="551" y="292" text-anchor="middle" fill="#0C447C">Monitoring segment</text>
<text font-size="12" x="551" y="308" text-anchor="middle" fill="#185FA5">192.168.30.67</text>
<text font-size="11" x="551" y="324" text-anchor="middle" fill="#185FA5">vmbr3 · 192.168.30.0/24</text>

<!-- DMZ → Internal block -->
<path d="M218 310 L251 310" stroke="#E24B4A" stroke-width="1.5" stroke-dasharray="4,3" fill="none" marker-end="url(#arrow)"/>
<text font-size="11" x="234" y="300" text-anchor="middle" fill="#A32D2D">block ✗</text>

<!-- Internal → Monitoring pass -->
<path d="M429 310 L462 310" stroke="#1D9E75" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<text font-size="11" x="445" y="300" text-anchor="middle" fill="#0F6E56">pass ✓</text>

<!-- DMZ → Monitoring curved pass -->
<path d="M129 334 Q129 420 551 420 L551 334" stroke="#1D9E75" stroke-width="1" stroke-dasharray="5,3" fill="none" marker-end="url(#arrow)"/>
<text font-size="11" x="340" y="436" text-anchor="middle" fill="#0F6E56">log traffic · pass ✓</text>

<!-- Legend -->
<rect x="60" y="468" width="560" height="82" rx="8" fill="none" stroke="#B4B2A9" stroke-width="0.5"/>
<text font-size="13" font-weight="500" x="80" y="490" fill="#2C2C2A">Legend</text>
<line x1="80" y1="514" x2="114" y2="514" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arrow)"/>
<text font-size="11" x="120" y="518" fill="#0F6E56">Permitted traffic</text>
<line x1="240" y1="514" x2="274" y2="514" stroke="#E24B4A" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
<text font-size="11" x="280" y="518" fill="#A32D2D">Blocked traffic</text>
<line x1="400" y1="514" x2="434" y2="514" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>
<text font-size="11" x="440" y="518" fill="#5F5E5A">Unfiltered uplink</text>
<text font-size="11" x="80" y="538" fill="#5F5E5A">All inter-segment traffic is enforced at the OPNsense firewall. Rules evaluated top-down, first match wins.</text>
</svg>
